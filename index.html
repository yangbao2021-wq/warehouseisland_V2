<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>平安下班術：倉儲現場安全必修課</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            background-color: #0b0f19;
            user-select: none;
            -webkit-user-select: none;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.90);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .island-pin {
            position: absolute;
            transform: translate(-50%, -100%);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            touch-action: manipulation;
        }
        .island-pin:active {
            transform: translate(-50%, -110%) scale(1.08);
        }
        #side-drawer {
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @media (max-width: 767px) {
            #side-drawer {
                width: 100% !important;
                max-height: 85vh !important;
                top: auto !important;
                bottom: 0 !important;
                transform: translateY(100%);
            }
            #side-drawer.drawer-open {
                transform: translateY(0) !important;
            }
        }
        @media (min-width: 768px) {
            #side-drawer {
                transform: translateX(100%);
            }
            #side-drawer.drawer-open {
                transform: translateX(0) !important;
            }
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(245, 158, 11, 0.5); border-radius: 10px; }
    </style>
</head>
<body class="w-screen h-screen relative text-slate-100">

    <!-- 2D Canvas Context Isometric Canvas Engine -->
    <canvas id="world-canvas" class="absolute inset-0 w-full h-full z-0 cursor-grab active:cursor-grabbing"></canvas>

    <!-- Overlay Floating Pins Layer -->
    <div id="pins-layer" class="absolute inset-0 pointer-events-none z-10"></div>

    <!-- Header UI -->
    <header class="absolute top-3 left-3 right-3 md:top-4 md:left-6 md:right-6 z-20 flex flex-col md:flex-row items-center justify-between gap-2.5 pointer-events-none">
        <div class="glass-panel rounded-2xl px-4 py-2.5 md:px-5 md:py-3 pointer-events-auto flex items-center justify-between w-full md:w-auto gap-3 shadow-2xl">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 md:w-11 md:h-11 rounded-xl bg-gradient-to-tr from-amber-500 via-orange-500 to-yellow-400 text-slate-950 font-black text-xl flex items-center justify-center shadow-lg shadow-orange-500/30 flex-shrink-0">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                    <h1 class="font-black text-base md:text-xl text-white tracking-wide flex items-center gap-2">
                        平安下班術
                        <span class="text-[9px] font-bold px-2 py-0.5 rounded bg-yellow-400/20 text-yellow-300 border border-yellow-400/40">倉儲現場工安島</span>
                    </h1>
                    <p class="text-[11px] text-slate-400 hidden sm:block">拖曳與縮放地圖 · 點擊島嶼與巡邏員工學習 SOP</p>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="flex flex-col items-end min-w-[90px] md:min-w-[130px] pl-3 border-l border-slate-700/60">
                <div class="flex items-center justify-between w-full text-[11px] md:text-xs font-bold mb-1">
                    <span class="text-slate-400 hidden xs:inline">通關率</span>
                    <span id="global-progress-num" class="text-yellow-400 font-black">0%</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden border border-slate-700">
                    <div id="global-progress-bar" class="bg-gradient-to-r from-orange-500 to-yellow-400 h-full w-0 transition-all duration-500 rounded-full"></div>
                </div>
            </div>
        </div>

        <!-- Controls Bar -->
        <div class="glass-panel rounded-2xl p-1.5 md:p-2 pointer-events-auto flex items-center justify-between w-full md:w-auto gap-2 shadow-2xl">
            <!-- Lighting Preset Buttons -->
            <div class="bg-slate-900/90 p-1 rounded-xl flex items-center gap-1 border border-slate-800 flex-1 md:flex-none justify-around">
                <button data-time="day" title="白班" class="time-btn active px-3 py-1.5 rounded-lg text-xs font-bold bg-yellow-400 text-slate-950 shadow transition">
                    <i class="fa-solid fa-sun text-amber-600"></i> <span class="hidden sm:inline ml-1">白班</span>
                </button>
                <button data-time="sunset" title="夕陽班" class="time-btn px-3 py-1.5 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-sun-plant-wilt text-orange-400"></i> <span class="hidden sm:inline ml-1">黃昏</span>
                </button>
                <button data-time="night" title="大夜班" class="time-btn px-3 py-1.5 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-moon text-indigo-400"></i> <span class="hidden sm:inline ml-1">夜班</span>
                </button>
            </div>

            <div class="h-6 w-[1px] bg-slate-800"></div>

            <!-- Audio Toggle -->
            <button id="sound-btn" title="切換音效" class="w-10 h-10 rounded-xl bg-slate-900/90 border border-slate-800 text-yellow-400 hover:text-yellow-300 transition flex items-center justify-center flex-shrink-0">
                <i class="fa-solid fa-volume-high text-sm"></i>
            </button>

            <!-- Certificate Button -->
            <button id="open-cert-btn" class="h-10 px-3 md:px-4 rounded-xl bg-gradient-to-r from-orange-500 via-amber-500 to-yellow-400 text-slate-950 text-xs font-extrabold transition flex items-center justify-center gap-1.5 shadow-lg shadow-orange-500/20 active:scale-95 flex-shrink-0">
                <i class="fa-solid fa-award text-sm"></i>
                <span>結業證書</span>
            </button>
        </div>
    </header>

    <!-- Bottom Filter Horizontal Menu -->
    <div class="absolute bottom-3 md:bottom-6 left-1/2 -translate-x-1/2 z-20 pointer-events-none w-full max-w-4xl px-3">
        <div class="glass-panel rounded-2xl p-1.5 pointer-events-auto flex items-center gap-1.5 overflow-x-auto shadow-2xl no-scrollbar">
            <button data-filter="ALL" class="zone-btn active px-3.5 py-2 rounded-xl text-xs font-black whitespace-nowrap bg-yellow-400 text-slate-950 transition shadow">
                全視角
            </button>
            <button data-filter="zone-1" class="zone-btn px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap text-slate-300 hover:bg-slate-800 transition">
                <i class="fa-solid fa-truck-ramp-box text-orange-400 mr-1"></i> 1.堆高機動線
            </button>
            <button data-filter="zone-2" class="zone-btn px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap text-slate-300 hover:bg-slate-800 transition">
                <i class="fa-solid fa-bolt text-sky-400 mr-1"></i> 2.電動搬運車
            </button>
            <button data-filter="zone-3" class="zone-btn px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap text-slate-300 hover:bg-slate-800 transition">
                <i class="fa-solid fa-boxes-stacked text-red-400 mr-1"></i> 3.高架防墜物
            </button>
            <button data-filter="zone-4" class="zone-btn px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap text-slate-300 hover:bg-slate-800 transition">
                <i class="fa-solid fa-gun text-yellow-400 mr-1"></i> 4.氣動釘槍
            </button>
            <button data-filter="zone-5" class="zone-btn px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap text-slate-300 hover:bg-slate-800 transition">
                <i class="fa-solid fa-box text-amber-500 mr-1"></i> 5.拆箱鐵釘
            </button>
            <button data-filter="zone-6" class="zone-btn px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap text-slate-300 hover:bg-slate-800 transition">
                <i class="fa-solid fa-flask-vial text-purple-400 mr-1"></i> 6.化物防漏
            </button>
        </div>
    </div>

    <!-- Side Drawer / Mobile Bottom Sheet Panel -->
    <div id="side-drawer" class="fixed top-0 right-0 h-full w-full sm:w-[480px] z-30 pointer-events-auto p-2 sm:p-5 flex flex-col justify-between">
        <div class="glass-panel h-full w-full rounded-3xl shadow-2xl flex flex-col overflow-hidden border border-slate-700/80">
            <!-- Mobile Drag Indicator -->
            <div class="w-12 h-1.5 bg-slate-600/60 rounded-full mx-auto my-2 md:hidden"></div>

            <!-- Drawer Header -->
            <div class="p-4 md:p-6 border-b border-slate-800 relative bg-slate-900/60 flex-shrink-0">
                <button id="close-drawer-btn" class="absolute top-4 right-4 md:top-6 md:right-6 w-9 h-9 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition border border-slate-700">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
                <div class="flex items-center gap-2 mb-1.5">
                    <span id="drawer-zone-tag" class="px-2.5 py-0.5 rounded-full text-[10px] font-black tracking-wider uppercase text-slate-950 bg-yellow-400">
                        HIGH RISK ZONE
                    </span>
                    <span id="drawer-status-tag" class="text-xs font-bold text-amber-400 flex items-center gap-1">
                        <i class="fa-regular fa-clock"></i> 尚待考驗認證
                    </span>
                </div>
                <h2 id="drawer-title" class="text-lg md:text-2xl font-black text-white tracking-wide pr-8">
                    1. 堆高機動線與視線盲區
                </h2>
            </div>

            <!-- Drawer Scrollable Content -->
            <div class="flex-1 overflow-y-auto p-4 md:p-6 space-y-5">
                <!-- Hazards -->
                <div class="p-3.5 rounded-2xl bg-gradient-to-r from-orange-500/15 to-yellow-500/10 border border-orange-500/30">
                    <h3 class="text-xs font-black text-orange-400 uppercase tracking-wider mb-1 flex items-center gap-2">
                        <i class="fa-solid fa-triangle-exclamation text-sm"></i> 現場危害與事故痛點
                    </h3>
                    <p id="drawer-hazards" class="text-xs text-slate-300 leading-relaxed font-medium"></p>
                </div>

                <!-- SOP Rules -->
                <div>
                    <h3 class="text-xs font-black text-slate-400 uppercase tracking-wider mb-2.5 flex items-center gap-1.5">
                        <i class="fa-solid fa-list-check text-yellow-400"></i> 標準作業流程 (SOP) 必修條款
                    </h3>
                    <div id="drawer-sop-list" class="space-y-2"></div>
                </div>

                <!-- Interactive Quiz -->
                <div class="p-4 rounded-2xl bg-slate-950/90 border border-slate-800 space-y-3 shadow-inner">
                    <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                        <span class="text-xs font-black text-yellow-400 uppercase tracking-widest flex items-center gap-1.5">
                            <i class="fa-solid fa-gamepad text-sm"></i> 工安實戰微驗收
                        </span>
                        <span class="text-[9px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded border border-slate-700">SINGLE CHOICE</span>
                    </div>
                    <p id="quiz-question" class="text-xs font-bold text-slate-200 leading-snug"></p>
                    <div id="quiz-options" class="space-y-2 pt-1"></div>
                    <div id="quiz-feedback" class="hidden text-xs p-3 rounded-xl font-bold leading-relaxed"></div>
                </div>
            </div>

            <!-- Footer -->
            <div class="p-3 md:p-4 border-t border-slate-800 bg-slate-950/60 flex items-center justify-center text-center flex-shrink-0">
                <p class="text-[10px] md:text-[11px] text-slate-400">安全是回家唯一的路 · 落實 SOP 杜絕職業災害</p>
            </div>
        </div>
    </div>

    <!-- Completion Certificate Modal -->
    <div id="cert-modal" class="fixed inset-0 z-40 bg-slate-950/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-lg rounded-3xl p-5 sm:p-8 shadow-2xl relative border border-slate-700 text-center max-h-[90vh] overflow-y-auto">
            <button id="close-cert-modal" class="absolute top-5 right-5 text-slate-400 hover:text-white transition w-8 h-8 flex items-center justify-center">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>

            <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl bg-gradient-to-tr from-amber-400 via-orange-500 to-yellow-300 text-slate-950 mx-auto flex items-center justify-center text-3xl sm:text-4xl shadow-xl shadow-orange-500/30 mb-3 sm:mb-4">
                <i class="fa-solid fa-award"></i>
            </div>

            <h3 class="text-xl sm:text-2xl font-black text-white tracking-wide">平安下班神射手證書</h3>
            <p class="text-xs text-slate-400 mt-0.5">倉儲現場安全必修課 結業認證</p>

            <div class="my-5 p-4 rounded-2xl bg-slate-900/90 border border-slate-800 text-left space-y-3">
                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                    <span class="text-xs text-slate-400">學員姓名：</span>
                    <input id="user-cert-name" type="text" value="倉儲第一線英雄" class="bg-slate-800 border border-slate-700 text-white text-xs font-bold rounded-lg px-2.5 py-1 text-right focus:outline-none focus:border-yellow-400 min-w-[140px]">
                </div>
                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                    <span class="text-xs text-slate-400">工安防線驗收：</span>
                    <span id="cert-completion-status" class="text-xs font-black text-emerald-400">0 / 6 島嶼全數精通</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-xs text-slate-400">核心承諾：</span>
                    <span class="text-xs font-bold text-yellow-400">「快樂上班，平安回家！」</span>
                </div>
            </div>

            <button id="print-cert-btn" class="w-full py-3 rounded-xl bg-gradient-to-r from-orange-500 to-yellow-400 text-slate-950 font-extrabold text-xs transition flex items-center justify-center gap-2 shadow-lg shadow-orange-500/20 active:scale-95">
                <i class="fa-solid fa-print"></i>
                <span>列印 / 儲存 PDF 證書</span>
            </button>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast-container" class="fixed top-20 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // --- Web Audio Sound Effects Synthesizer ---
        const AudioFX = {
            ctx: null,
            muted: false,
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
            },
            playClick() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(850, this.ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            },
            playSuccess() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523, now);
                osc.frequency.setValueAtTime(659, now + 0.08);
                osc.frequency.setValueAtTime(783, now + 0.16);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.35);
            },
            playFail() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(150, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.3);
            }
        };

        document.getElementById('sound-btn').addEventListener('click', () => {
            AudioFX.muted = !AudioFX.muted;
            const btn = document.getElementById('sound-btn');
            btn.innerHTML = AudioFX.muted ? 
                '<i class="fa-solid fa-volume-xmark text-slate-500 text-sm"></i>' : 
                '<i class="fa-solid fa-volume-high text-yellow-400 text-sm"></i>';
            showToast(AudioFX.muted ? '靜音模式' : '音效已開啟');
        });

        // --- Data Model for Safety Zones ---
        const ZONES = [
            {
                id: 'zone-1',
                title: '1. 堆高機動線與視線盲區',
                color: '#f97316',
                isoPos: { x: 0, y: 0 },
                hazards: '轉角視線死角撞擊、過彎車速過快甩尾翻車、人員闖入行車通道。',
                sop: [
                    { title: '路口停看聽鳴笛', desc: '行經通道交叉口、出入口必須減速降至 5km/h 以下並鳴笛。' },
                    { title: '視線受阻採倒車行駛', desc: '載物高度超過擋貨架影響前瞻視線時，一律採取倒車後退駕駛。' },
                    { title: '安全警戒區 3 公尺', desc: '堆高機叉舉貨物作業時，方圓 3 公尺內嚴禁任何人員逗留。' }
                ],
                quiz: {
                    q: '當堆高機載運高大棧板、貨物已完全遮蔽駕駛前方視線時，正確的操作方式是？',
                    options: [
                        '探出頭邊看邊往前行駛',
                        '改採取倒車方向後退行駛，並確認後方防護',
                        '加速衝過盲區路口',
                        '持續大聲叫喊讓周遭人員避讓'
                    ],
                    answer: 1,
                    explain: '視線受阻時一律採取倒車駕駛，並搭配倒車警報器提示周遭人員！'
                }
            },
            {
                id: 'zone-2',
                title: '2. 電動搬運車與板車安全',
                color: '#38bdf8',
                isoPos: { x: 230, y: -115 },
                hazards: '車輪壓傷腳趾、緊急煞車導致托盤貨物甩飛坍塌、控制拉桿夾傷手部。',
                sop: [
                    { title: '穿著鋼頭防砸鞋', desc: '進入作業區全程佩戴鋼頭防砸安全鞋，預防車輪壓傷足部。' },
                    { title: '操作手把保持安全距離', desc: '控制轉向拉桿時手部位於防護托內，防止擠壓牆面。' },
                    { title: '轉彎前提前減速', desc: '轉彎時必須預留尾部甩尾空間，嚴禁高速陡轉。' }
                ],
                quiz: {
                    q: '操作電動板車行經狹窄通道轉彎時，下列哪一項做法是正確的？',
                    options: [
                        '單手操作拉桿並甩尾轉彎',
                        '提前減速，確認周遭無人員並留出轉彎離隙',
                        '邊看手機邊控制速度',
                        '持續按住最高速按鈕轉彎'
                    ],
                    answer: 1,
                    explain: '電動板車車尾轉彎有甩尾夾傷風險，必須提前減速並注意離隙！'
                }
            },
            {
                id: 'zone-3',
                title: '3. 高層架防墜物與綑綁',
                color: '#ef4444',
                isoPos: { x: -230, y: -115 },
                hazards: '頂層散裝物品地震落物砸傷、破損棧板上架斷裂跌落、打包膜未裹緊。',
                sop: [
                    { title: '進入高架區佩戴安全帽', desc: '進入高層架區必須戴緊安全帽並扣好顎帶。' },
                    { title: '膠膜包覆 3 層以上', desc: '上高架棧板物料必須使用纏繞膜完整包覆，防止單件脫落。' },
                    { title: '重物在下輕物在上', desc: '遵循層架限重標示，極重物料嚴禁置於三層以上高位。' }
                ],
                quiz: {
                    q: '高層架物品在安排上架作業前，最重要的防墜檢查項目是？',
                    options: [
                        '檢查棧板有無裂痕及膠膜是否紮實包覆',
                        '確認外箱圖案是否精美',
                        '直接快速上架無需檢查',
                        '給棧板刷上潤滑油'
                    ],
                    answer: 0,

        ];

        let clearedZones = new Set();
        let timeMode = 'day';

        const THEMES = {
            day: { bg: '#0b0f19', islandTop: '#222f43', islandSide1: '#182232', islandSide2: '#101724', grid: 'rgba(255,255,255,0.04)' },
            sunset: { bg: '#1c101b', islandTop: '#3d2538', islandSide1: '#2b1928', islandSide2: '#1a0e18', grid: 'rgba(255,150,100,0.06)' },
            night: { bg: '#05070e', islandTop: '#181f38', islandSide1: '#0f1426', islandSide2: '#080a14', grid: 'rgba(0,229,255,0.08)' }
        };

        // --- Canvas Setup & High DPI Handling ---
        const canvas = document.getElementById('world-canvas');
        const ctx = canvas.getContext('2d');
        const pinsContainer = document.getElementById('pins-layer');

        let cameraOffset = { x: 0, y: 0 };
        let cameraZoom = 1;
        let isDragging = false;
        let startDrag = { x: 0, y: 0 };
        let initialPinchDistance = null;

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = `${window.innerWidth}px`;
            canvas.style.height = `${window.innerHeight}px`;
            ctx.resetTransform();
            ctx.scale(dpr, dpr);

            if (cameraOffset.x === 0 && cameraOffset.y === 0) {
                cameraOffset.x = window.innerWidth / 2;
                cameraOffset.y = window.innerHeight / 2 + 10;
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Mouse & Touch Gestures
        function getPos(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            const p = getPos(e);
            startDrag = { x: p.x - cameraOffset.x, y: p.y - cameraOffset.y };
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const p = getPos(e);
                cameraOffset.x = p.x - startDrag.x;
                cameraOffset.y = p.y - startDrag.y;
            }
        });

        window.addEventListener('mouseup', () => isDragging = false);

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                const p = getPos(e);
                startDrag = { x: p.x - cameraOffset.x, y: p.y - cameraOffset.y };
            } else if (e.touches.length === 2) {
                isDragging = false;
                initialPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if (isDragging && e.touches.length === 1) {
                const p = getPos(e);
                cameraOffset.x = p.x - startDrag.x;
                cameraOffset.y = p.y - startDrag.y;
            } else if (e.touches.length === 2 && initialPinchDistance) {
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const zoomFactor = dist / initialPinchDistance;
                cameraZoom = Math.min(Math.max(cameraZoom * (zoomFactor > 1 ? 1.02 : 0.98), 0.65), 1.6);
                initialPinchDistance = dist;
            }
        }, { passive: true });

        canvas.addEventListener('touchend', () => {
            isDragging = false;
            initialPinchDistance = null;
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const factor = e.deltaY < 0 ? 1.08 : 0.92;
            cameraZoom = Math.min(Math.max(cameraZoom * factor, 0.65), 1.6);
        }, { passive: false });

        // --- Workers (NPC) & AGV Setup ---
        const workers = ZONES.map((z, idx) => ({
            id: idx,
            currentZoneIdx: idx,
            targetZoneIdx: (idx + 1) % ZONES.length,
            progress: Math.random(),
            state: 'WALKING', // WALKING | WORKING
            workTimer: 0
        }));

        const agvs = [
            { currentIdx: 0, targetIdx: 1, progress: 0 },
            { currentIdx: 3, targetIdx: 4, progress: 0.5 }
        ];

        // --- Floating DOM Pins ---
        function createPins() {
            pinsContainer.innerHTML = '';
            ZONES.forEach(zone => {
                const pin = document.createElement('div');
                pin.className = 'island-pin pointer-events-auto';
                pin.setAttribute('data-id', zone.id);

                        <span class="text-xs font-black text-white whitespace-nowrap">${zone.title.split('.')[1]}</span>
                        <i class="fa-solid ${isCleared ? 'fa-circle-check text-emerald-400' : 'fa-chevron-right text-slate-400'} text-xs"></i>
                    </div>
                `;
                pinsContainer.appendChild(pin);
            });
        }

        function updatePinsPosition() {
            const pins = pinsContainer.querySelectorAll('.island-pin');
            pins.forEach(pin => {
                const id = pin.getAttribute('data-id');
                const zone = ZONES.find(z => z.id === id);
                if (zone) {
                    const sx = cameraOffset.x + zone.isoPos.x * cameraZoom;
                    const sy = cameraOffset.y + zone.isoPos.y * cameraZoom - 55 * cameraZoom;
                    pin.style.left = `${sx}px`;
                    pin.style.top = `${sy}px`;
                    pin.style.transform = `translate(-50%, -100%) scale(${Math.max(0.75, cameraZoom)})`;
                }
            });
        }

        // --- Canvas Rendering Logic ---
        function drawHex(cx, cy, r, fillTop, fillSide1, fillSide2, accentColor) {
            const h = 45 * cameraZoom;
            const topPts = [];
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i - Math.PI / 6;
                topPts.push({
                    x: cx + r * Math.cos(angle),
                    y: cy + (r * Math.sin(angle)) * 0.5
                });
            }

            // Side 1
            ctx.fillStyle = fillSide1;
            ctx.beginPath();
            ctx.moveTo(topPts[1].x, topPts[1].y);
            ctx.lineTo(topPts[2].x, topPts[2].y);
            ctx.lineTo(topPts[2].x, topPts[2].y + h);
            ctx.lineTo(topPts[1].x, topPts[1].y + h);
            ctx.closePath();
            ctx.fill();

            // Side 2
            ctx.fillStyle = fillSide2;
            ctx.beginPath();
            ctx.moveTo(topPts[2].x, topPts[2].y);
            ctx.lineTo(topPts[3].x, topPts[3].y);
            ctx.lineTo(topPts[3].x, topPts[3].y + h);
            ctx.lineTo(topPts[2].x, topPts[2].y + h);
            ctx.closePath();
            ctx.fill();

            // Top
            ctx.fillStyle = fillTop;
            ctx.beginPath();
            ctx.moveTo(topPts[0].x, topPts[0].y);
            for (let i = 1; i < 6; i++) ctx.lineTo(topPts[i].x, topPts[i].y);
            ctx.closePath();
            ctx.fill();

            // Highlight border
            ctx.strokeStyle = accentColor;
            ctx.lineWidth = 2 * cameraZoom;
            ctx.stroke();
        }

        // Props Rendering
        function drawProps(zone, cx, cy) {
            const z = cameraZoom;
            ctx.save();
            ctx.translate(cx, cy);

            if (zone.id === 'zone-1') {
                // Forklift & Pedestrian Crossing
                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(-15 * z, -15 * z, 30 * z, 18 * z);
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(-18 * z, 0, 8 * z, 8 * z);
                ctx.fillRect(10 * z, 0, 8 * z, 8 * z);
                // Zebra crossing lines
                ctx.fillStyle = '#ffffff';
                for (let i = -25; i <= 25; i += 12) {
                    ctx.fillRect(i * z, 15 * z, 6 * z, 10 * z);
                }
            } else if (zone.id === 'zone-2') {
                // EP Stacker
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(-12 * z, -10 * z, 24 * z, 14 * z);
                ctx.fillStyle = '#0284c7';
                ctx.fillRect(8 * z, -18 * z, 4 * z, 20 * z);
            } else if (zone.id === 'zone-3') {
                // High Racks
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 3 * z;
                ctx.strokeRect(-20 * z, -25 * z, 40 * z, 30 * z);
                ctx.fillStyle = '#d97706';
                ctx.fillRect(-15 * z, -20 * z, 12 * z, 10 * z);
                ctx.fillRect(3 * z, -8 * z, 12 * z, 10 * z);
            } else if (zone.id === 'zone-4') {
                // Workbench & Nailgun
                ctx.fillStyle = '#78350f';
                ctx.fillRect(-20 * z, -10 * z, 40 * z, 15 * z);
                ctx.fillStyle = '#eab308';
                ctx.fillRect(-5 * z, -16 * z, 10 * z, 6 * z);
            } else if (zone.id === 'zone-5') {
                // Crate & Prybar
                ctx.fillStyle = '#b45309';
                ctx.fillRect(-15 * z, -15 * z, 30 * z, 20 * z);
                ctx.strokeStyle = '#92400e';
                ctx.strokeRect(-15 * z, -15 * z, 30 * z, 20 * z);
                // Nail
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 2 * z;
                ctx.beginPath();
                ctx.moveTo(5 * z, -15 * z); ctx.lineTo(5 * z, -23 * z);
                ctx.stroke();
            } else if (zone.id === 'zone-6') {
                // Chemical Spill & Drums
                ctx.fillStyle = '#c084fc';
                ctx.beginPath();
                ctx.ellipse(0, 5 * z, 22 * z, 10 * z, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#a855f7';
                ctx.fillRect(-12 * z, -18 * z, 10 * z, 16 * z);
                ctx.fillRect(4 * z, -14 * z, 10 * z, 14 * z);
            }

            ctx.restore();
        }

        // Draw Worker NPC
        function drawWorker(x, y, animFrame, isWorking) {
            const z = cameraZoom;
            ctx.save();
            ctx.translate(x, y);

            // Body (High-vis vest)
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(-4 * z, -14 * z, 8 * z, 10 * z);

            // Hardhat
            ctx.fillStyle = '#eab308';
            ctx.beginPath();
            ctx.arc(0, -17 * z, 5 * z, Math.PI, 0);
            ctx.fill();

            // Legs Animation
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 2 * z;
            const legSwing = isWorking ? Math.sin(animFrame * 0.2) * 3 : Math.sin(animFrame * 0.1) * 4;
            ctx.beginPath();
            ctx.moveTo(-2 * z, -4 * z); ctx.lineTo(-2 * z + legSwing * z, 0);
            ctx.moveTo(2 * z, -4 * z); ctx.lineTo(2 * z - legSwing * z, 0);
            ctx.stroke();

            ctx.restore();
        }

        // Draw AGV
        function drawAGV(x, y) {
            const z = cameraZoom;
            ctx.save();
            ctx.translate(x, y);

            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(-10 * z, -6 * z, 20 * z, 12 * z);
            ctx.fillStyle = '#fbbf24';
            ctx.fillRect(-6 * z, -4 * z, 12 * z, 8 * z); // Box on top

            ctx.restore();
        }

        // Main Render Loop
        let animFrame = 0;
        function render() {
            animFrame++;
            const t = THEMES[timeMode];

            // Clear Background
            ctx.fillStyle = t.bg;
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

            // Grid Lines
            ctx.strokeStyle = t.grid;
            ctx.lineWidth = 1;
            const step = 40 * cameraZoom;
            for (let x = (cameraOffset.x % step); x < window.innerWidth; x += step) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, window.innerHeight); ctx.stroke();
            }

            // Draw Pathway Connections
            ctx.strokeStyle = 'rgba(245, 158, 11, 0.25)';
            ctx.setLineDash([6 * cameraZoom, 6 * cameraZoom]);
            ctx.lineWidth = 3 * cameraZoom;
            ctx.beginPath();
            for (let i = 0; i < ZONES.length; i++) {
                const z1 = ZONES[i];
                const z2 = ZONES[(i + 1) % ZONES.length];
                const p1 = { x: cameraOffset.x + z1.isoPos.x * cameraZoom, y: cameraOffset.y + z1.isoPos.y * cameraZoom };
                const p2 = { x: cameraOffset.x + z2.isoPos.x * cameraZoom, y: cameraOffset.y + z2.isoPos.y * cameraZoom };
                if (i === 0) ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
            }
            ctx.closePath();
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw Islands & Micro Props
            ZONES.forEach(zone => {
                const cx = cameraOffset.x + zone.isoPos.x * cameraZoom;
                const cy = cameraOffset.y + zone.isoPos.y * cameraZoom;
                const r = 90 * cameraZoom;

                const isCleared = clearedZones.has(zone.id);
                drawHex(cx, cy, r, t.islandTop, t.islandSide1, t.islandSide2, isCleared ? '#34d399' : zone.color);
                drawProps(zone, cx, cy);
            });

            // Update & Draw Workers
            workers.forEach(w => {
                const z1 = ZONES[w.currentZoneIdx];
                const z2 = ZONES[w.targetZoneIdx];

                if (w.state === 'WALKING') {
                    w.progress += 0.003;
                    if (w.progress >= 1) {
                        w.progress = 0;
                        w.state = 'WORKING';
                        w.workTimer = 180; // Work for 180 frames
                    }
                } else if (w.state === 'WORKING') {
                    w.workTimer--;
                    if (w.workTimer <= 0) {
                        w.currentZoneIdx = w.targetZoneIdx;
                        w.targetZoneIdx = (w.targetZoneIdx + 1) % ZONES.length;
                        w.state = 'WALKING';
                    }
                }

                const p1 = { x: cameraOffset.x + z1.isoPos.x * cameraZoom, y: cameraOffset.y + z1.isoPos.y * cameraZoom };
                const p2 = { x: cameraOffset.x + z2.isoPos.x * cameraZoom, y: cameraOffset.y + z2.isoPos.y * cameraZoom };

                const wx = p1.x + (p2.x - p1.x) * w.progress;
                const wy = p1.y + (p2.y - p1.y) * w.progress;

                drawWorker(wx, wy, animFrame, w.state === 'WORKING');
            });

            // Update & Draw AGVs
            agvs.forEach(agv => {
                agv.progress += 0.002;
                if (agv.progress >= 1) agv.progress = 0;

                const z1 = ZONES[agv.currentIdx];
                const z2 = ZONES[agv.targetIdx];
                const p1 = { x: cameraOffset.x + z1.isoPos.x * cameraZoom, y: cameraOffset.y + z1.isoPos.y * cameraZoom };
                const p2 = { x: cameraOffset.x + z2.isoPos.x * cameraZoom, y: cameraOffset.y + z2.isoPos.y * cameraZoom };

                const ax = p1.x + (p2.x - p1.x) * agv.progress;
                const ay = p1.y + (p2.y - p1.y) * agv.progress;

                drawAGV(ax, ay);
            });

            updatePinsPosition();
            requestAnimationFrame(render);
        }

        // --- Drawer & Quiz Controllers ---
        const sideDrawer = document.getElementById('side-drawer');

        function openZoneDrawer(zone) {
            AudioFX.playClick();

            optionsContainer.innerHTML = '';
            zone.quiz.options.forEach((opt, optIdx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-xs text-slate-200 font-medium transition border border-slate-800 flex items-center justify-between active:scale-[0.98]";
                btn.innerHTML = `<span>${opt}</span><i class="fa-regular fa-circle text-slate-600"></i>`;
                btn.onclick = () => submitQuiz(zone, optIdx, feedback);

        function submitQuiz(zone, selectedIdx, feedbackEl) {
            if (selectedIdx === zone.quiz.answer) {
                AudioFX.playSuccess();
                feedbackEl.className = "block text-xs p-3 rounded-xl font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
                feedbackEl.innerText = `🎉 答對了！ ${zone.quiz.explain}`;

                clearedZones.add(zone.id);
                updateProgress();
                createPins();
            } else {
                AudioFX.playFail();
                feedbackEl.className = "block text-xs p-3 rounded-xl font-bold bg-red-500/20 text-red-300 border border-red-500/30";
                feedbackEl.innerText = `❌ 回答錯誤！請再研讀 SOP 防線指引後重試。`;
            }
        }

        function updateProgress() {
            const pct = Math.round((clearedZones.size / ZONES.length) * 100);
            document.getElementById('global-progress-num').innerText = `${pct}%`;
            document.getElementById('global-progress-bar').style.width = `${pct}%`;
            if (clearedZones.size === ZONES.length) showToast('🏆 恭喜精通全庫區 6 大工安防線，可領取結業證書！');
        }

        document.getElementById('close-drawer-btn').addEventListener('click', () => {
            sideDrawer.classList.remove('drawer-open');
        });

        // Filter Bar Switcher
        document.querySelectorAll('.zone-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                AudioFX.playClick();
                document.querySelectorAll('.zone-btn').forEach(b => {
                    b.classList.remove('bg-yellow-400', 'text-slate-950', 'active');
                    b.classList.add('text-slate-300');
                });
                e.currentTarget.classList.add('bg-yellow-400', 'text-slate-950', 'active');
                e.currentTarget.classList.remove('text-slate-300');

                const filter = e.currentTarget.getAttribute('data-filter');
                if (filter === 'ALL') {
                    cameraOffset.x = window.innerWidth / 2;
                    cameraOffset.y = window.innerHeight / 2 + 10;
                    cameraZoom = 1;
                } else {
                    const zone = ZONES.find(z => z.id === filter);
                    if (zone) {
                        cameraOffset.x = window.innerWidth / 2 - zone.isoPos.x * cameraZoom;
                        cameraOffset.y = window.innerHeight / 2 - zone.isoPos.y * cameraZoom;
                        openZoneDrawer(zone);
                    }
                }
            });
        });

        // Theme Switcher
        document.querySelectorAll('.time-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                AudioFX.playClick();
                document.querySelectorAll('.time-btn').forEach(b => {
                    b.classList.remove('bg-yellow-400', 'text-slate-950');
                    b.classList.add('text-slate-400');
                });
                e.currentTarget.classList.add('bg-yellow-400', 'text-slate-950');
                e.currentTarget.classList.remove('text-slate-400');
                timeMode = e.currentTarget.getAttribute('data-time');
            });
        });

        // Certificate Modal Logic
        const certModal = document.getElementById('cert-modal');
        document.getElementById('open-cert-btn').addEventListener('click', () => {
            AudioFX.playClick();
            document.getElementById('cert-completion-status').innerText = `${clearedZones.size} / ${ZONES.length} 島嶼全數精通`;
            certModal.classList.remove('hidden');
            setTimeout(() => certModal.classList.remove('opacity-0'), 10);
        });

        document.getElementById('close-cert-modal').addEventListener('click', () => {
            certModal.classList.add('opacity-0');
            setTimeout(() => certModal.classList.add('hidden'), 300);
        });

        document.getElementById('print-cert-btn').addEventListener('click', () => window.print());

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'glass-panel px-4 py-3 rounded-2xl text-xs font-bold text-white border border-yellow-400/40 shadow-xl';
            toast.innerHTML = `<i class="fa-solid fa-bell text-yellow-400 mr-2"></i>${msg}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3200);
        }

        // Initialize Application
        createPins();
        render();
    </script>
</body>
</html>
